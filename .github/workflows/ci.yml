name: CI

on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]

jobs:
  build:
    name: Build (Node + Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Build frontend (TypeScript + Vite)
        run: npm run build

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 'stable'

      - name: Verify Rust (cargo) version
        run: cargo --version

      - name: Install Linux dependencies for Tauri
        run: |
         sudo apt update
         sudo apt install -y \
           build-essential \
           pkg-config \
           libssl-dev \
           libgtk-3-dev \
           libwebkit2gtk-4.1-dev \
           libayatana-appindicator3-dev \
           libsecret-1-dev \
           libgdk-pixbuf2.0-dev \
           libdbus-1-dev \
           librsvg2-dev \
           patchelf

      - name: Build Tauri backend
        working-directory: src-tauri
        run: cargo build --verbose
