[package]
name = "hr-track"
version = "1.0.0"
description = "HR Track - Offline HR Management Application"
authors = ["HR Track"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "hr_track_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-sql = { version = "2.0", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
